name: Frontend Test

on:
  push:
    branches: [main, develop, develop-dummy, main-dummy]
  pull_request:
    branches: [main, develop, develop-dummy, main-dummy]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Nodeセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 依存関係インストール
        run: npm ci
      # - run: npm install
      - name: buildチェック
        run: npm run build
      - name: テスト実行
        run: npm run test
