name: Frontend Test

on:
  push:
    branches: [main, develop, develop-dummy, main-dummy]
  pull_request:
    branches: [main, develop, develop-dummy, main-dummy]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Nodeセットアップ
        uses: actions/setup-node@v3
        with:
          node-version: 22.19.0
          cache: "npm"
      - name: 依存関係インストール
        run: npm ci
      # - run: npm install
      - name: テスト実行
        run: npm run test
